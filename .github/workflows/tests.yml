name: tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        laravel: ['13.*']
        dependencies: ['highest']
        include:
          - php: '8.4'
            laravel: '13.*'
            dependencies: 'lowest'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: afterburner
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: afterburner
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      pgsql:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: afterburner
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      AFTERBURNER_TEST_MYSQL_HOST: 127.0.0.1
      AFTERBURNER_TEST_MYSQL_PORT: 3306
      AFTERBURNER_TEST_MYSQL_DATABASE: afterburner
      AFTERBURNER_TEST_MYSQL_USERNAME: root
      AFTERBURNER_TEST_MYSQL_PASSWORD: secret
      AFTERBURNER_TEST_MARIADB_HOST: 127.0.0.1
      AFTERBURNER_TEST_MARIADB_PORT: 3307
      AFTERBURNER_TEST_MARIADB_DATABASE: afterburner
      AFTERBURNER_TEST_MARIADB_USERNAME: root
      AFTERBURNER_TEST_MARIADB_PASSWORD: secret
      AFTERBURNER_TEST_PGSQL_HOST: 127.0.0.1
      AFTERBURNER_TEST_PGSQL_PORT: 5432
      AFTERBURNER_TEST_PGSQL_DATABASE: afterburner
      AFTERBURNER_TEST_PGSQL_USERNAME: postgres
      AFTERBURNER_TEST_PGSQL_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Allow stored functions in the binary-logging engines
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -psecret -e "SET GLOBAL log_bin_trust_function_creators = 1;"
          mysql -h127.0.0.1 -P3307 -uroot -psecret -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Command tests (fails if a database engine was skipped)
        run: vendor/bin/pest --testsuite=Feature --fail-on-skipped

      - name: Host process tests
        run: vendor/bin/pest --testsuite=Process

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  # The single check the merge ruleset requires (.github/rulesets/require-tests.json), so
  # the matrix can change without editing the ruleset. It runs even when a needed job fails
  # because a skipped required check would count as passing.
  tests-passed:
    name: Tests passed
    if: always()
    needs: [tests, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test and lint job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
